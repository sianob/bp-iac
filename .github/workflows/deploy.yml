name: Terraform Deploy
description: Provision an Azure Kubernetes Service using Terraform
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      action:
        description: "Action to perform"
        required: true
        default: "create"
        type: choice
        options:
          - create
          - destroy

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: aks-${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars"

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="terraform.tfvars"
        if: github.event.inputs.action == 'create'

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="terraform.tfvars"
        if: github.event.inputs.action == 'destroy'

      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GH_PAT }}"
        if: github.event.inputs.action == 'create'        

      - name: Store Kubeconfig as secret for deploy - ${{ github.event.inputs.environment }}
        run: |
          ENV_NAME=${{ github.event.inputs.environment }}
          SECRET_NAME="KUBECONFIG_${ENV_NAME^^}"  # Bash uppercase
          echo "Setting secret $SECRET_NAME"

          gh secret set "$SECRET_NAME" \
            --repo salob/bp-deploy \
            --body "$(cat kubeconfig)"
        if: github.event.inputs.action == 'create'

      - name: Delete Kubeconfig secret for deploy - ${{ github.event.inputs.environment }}
        run: |
          ENV_NAME=${{ github.event.inputs.environment }}
          SECRET_NAME="KUBECONFIG_${ENV_NAME^^}"  # Bash uppercase
          echo "Deleting secret $SECRET_NAME"
          gh secret delete "$SECRET_NAME"
        if: github.event.inputs.action == 'destroy'
       
