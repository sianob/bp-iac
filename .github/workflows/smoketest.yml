name: Terraform SmokeTest

on:
  pull_request:
    branches:
      - main

  workflow_call:
    secrets:
      ARM_CLIENT_ID:
        required: true
      ARM_CLIENT_SECRET:
        required: true
      ARM_TENANT_ID:
        required: true
      ARM_SUBSCRIPTION_ID:
        required: true
      GH_PAT:
        required: true
        description: "GitHub Personal Access Token with repo scope"

jobs:
  smoketest:
    name: smoketest
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    strategy:
      matrix:
        env_dir: [aks-staging, aks-prod]

    defaults:
      run:
        working-directory: ${{ matrix.env_dir }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          repository: sianob/bp-iac
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GH_PAT }} # Needed to access private repos
       
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Terraform Init (${{ matrix.env_dir }})
        run: terraform init

      - name: Terraform Validate (${{ matrix.env_dir }})
        run: terraform validate
